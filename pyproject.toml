[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "PERF"]
ignore = [
    "EXE001",
    "DTZ005",
    "BLE001",
    "PLW1510",
    "RUF059",
    "E501",
    "SIM117",
    "UP015",
    "PERF401",
    "PERF402",
    "SIM105",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
